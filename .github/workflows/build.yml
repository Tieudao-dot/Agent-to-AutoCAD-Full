# Builds and tests ClaudeCAD on Windows (real named pipes, both plugin targets),
# produces the bundle zip + update manifest + Setup.exe as artifacts, and
# publishes them as a GitHub release when a tag v* is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release v<version> (tag created on this commit)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      # .NET 8 for the AutoCAD 2025-2026 build and the tests, .NET 10 for the AutoCAD 2027 build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Sidecar - install, test (IPC over Windows named pipes), build
        working-directory: agent
        run: |
          npm ci
          npm test
          npm run build

      - name: Plugin core unit tests
        run: dotnet test plugin/ClaudeCAD.Core.Tests -c Release

      - name: Palette UI tests (real WPF palette, screenshots)
        env:
          CLAUDECAD_UI_SHOTS: ${{ github.workspace }}/ui-screens
        run: dotnet test plugin/ClaudeCAD.UI.Tests -c Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-screenshots
          path: ui-screens/*.png
          if-no-files-found: warn

      - name: Plugin build (net48 for AutoCAD 2022-2024, net8.0-windows for 2025-2026, net10.0-windows for 2027)
        run: dotnet build plugin/ClaudeCAD.Plugin/ClaudeCAD.Plugin.csproj -c Release -p:AcadRefSource=NuGet

      - name: All three plugin builds present
        run: |
          foreach ($p in 'bin/Release/ClaudeCAD.Plugin.dll', 'bin/Release/acad2025/ClaudeCAD.Plugin.dll', 'bin/Release/acad2027/ClaudeCAD.Plugin.dll') {
            $f = Join-Path plugin/ClaudeCAD.Plugin $p
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            Write-Host "$f  $((Get-Item $f).Length) bytes"
          }

      - name: Version
        id: ver
        run: |
          $v = (Get-Content agent/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Node.js for Windows to bundle (users do not install Node)
        run: |
          $nv = 'v22.12.0'
          Invoke-WebRequest "https://nodejs.org/dist/$nv/node-$nv-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          "NODE_DIR=$(Resolve-Path "node-dist/node-$nv-win-x64")" >> $env:GITHUB_ENV

      - name: Bundle + zip + update manifest
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/ClaudeCAD-$v.zip"
          node bundle/make-bundle.mjs --zip --node-dir $env:NODE_DIR --download-url $url --update-url "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

      - name: Setup.exe (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\ClaudeCAD.iss
          Copy-Item installer\install.ps1 bundle\out\install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCAD-${{ steps.ver.outputs.version }}
          path: |
            bundle/out/ClaudeCAD-*.zip
            bundle/out/ClaudeCAD-Setup.exe
            bundle/out/latest.json
            bundle/out/install.ps1
          if-no-files-found: error

      # main: a new version number in agent/package.json publishes a release automatically, so the
      # download link (releases/latest/download/ClaudeCAD-Setup.exe) always serves the newest installer
      - name: New version on main?
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT } else { "new=true" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Release notes (SHA-256 to check the download)
        run: |
          $f = Get-Item bundle/out/ClaudeCAD-Setup.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          $v = '${{ steps.ver.outputs.version }}'
          @(
            "ClaudeCAD $v — hướng dẫn cài: https://github.com/${{ github.repository }}/tree/main/bo-cai",
            "",
            "Kiểm tra file tải về (PowerShell: Get-FileHash .\ClaudeCAD-Setup.exe):",
            "- ClaudeCAD-Setup.exe: $($f.Length) bytes",
            "- SHA-256: $h"
          ) | Set-Content -Encoding utf8 release-notes.md

      # Since v0.9.4 every machine needs a key. A release built without the activation service url would lock
      # out every user who updates (no way to request or check a key online): refuse to publish it.
      - name: Activation service configured?
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release || steps.rel.outputs.new == 'true'
        run: |
          $url = (Get-Content activation/activation.json -Raw | ConvertFrom-Json).url
          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Error "activation/activation.json has no url: deploy the Apps Script (activation/README.md) and put its web app url there before releasing."
            exit 1
          }
          Write-Host "activation service: $url"

      - name: Release (tags, a manual run with "release", or a new version on main)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release || steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ClaudeCAD v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            bundle/out/ClaudeCAD-*.zip
            bundle/out/ClaudeCAD-Setup.exe
            bundle/out/latest.json
            bundle/out/install.ps1
