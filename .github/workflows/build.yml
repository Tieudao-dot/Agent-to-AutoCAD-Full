# Builds and tests ClaudeCAD on Windows (real named pipes, both plugin targets),
# produces the bundle zip + update manifest + Setup.exe as artifacts, and
# publishes them as a GitHub release when a tag v* is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sidecar - install, test (IPC over Windows named pipes), build
        working-directory: agent
        run: |
          npm ci
          npm test
          npm run build

      - name: Plugin core unit tests
        run: dotnet test plugin/ClaudeCAD.Core.Tests -c Release

      - name: Plugin build (net48 for AutoCAD 2022-2024, net8.0-windows for AutoCAD 2025)
        run: dotnet build plugin/ClaudeCAD.Plugin/ClaudeCAD.Plugin.csproj -c Release -p:AcadRefSource=NuGet

      - name: Version
        id: ver
        run: |
          $v = (Get-Content agent/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bundle + zip + update manifest
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/ClaudeCAD-$v.zip"
          node bundle/make-bundle.mjs --zip --download-url $url --update-url "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

      - name: Setup.exe (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\ClaudeCAD.iss
          Copy-Item installer\install.ps1 bundle\out\install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCAD-${{ steps.ver.outputs.version }}
          path: |
            bundle/out/ClaudeCAD-*.zip
            bundle/out/ClaudeCAD-Setup-*.exe
            bundle/out/latest.json
            bundle/out/install.ps1
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/out/ClaudeCAD-*.zip
            bundle/out/ClaudeCAD-Setup-*.exe
            bundle/out/latest.json
            bundle/out/install.ps1
